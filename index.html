<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Valentine's Day ❤️</title>

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: #fff;
      text-align: center;
      overflow: hidden;
    }

    .card {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      max-width: 500px;
      animation: fadeIn 2s ease-in-out;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
    }

    p {
      font-size: 1.2rem;
      line-height: 1.6;
    }

    .heart {
      font-size: 3rem;
      animation: pulse 1.5s infinite;
    }

    button {
      margin-top: 20px;
      padding: 12px 24px;
      border: none;
      border-radius: 25px;
      font-size: 1rem;
      cursor: pointer;
      background: #ff4b6e;
      color: white;
      transition: transform 0.3s ease, background 0.3s ease;
    }

    button:hover {
      transform: scale(1.1);
      background: #ff1e4d;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="heart">❤️</div>
    <h1>Happy Valentine's Day</h1>
    <p id="message">
      From the moment you came into my life, everything became brighter, softer, and more meaningful. 💖
      <br /><br />
      No matter the distance between us, my heart always finds its way to you.
    </p>

    <button onclick="showMoreLove()">Click for a Surprise ✨</button>
  </div>

  <script>
    function showMoreLove() {
      const msg = document.getElementById('message');
      msg.innerHTML = `
        You are my safe place, my happiness, and my favorite person in the whole world. 💞<br /><br />
        I love you more with every heartbeat… and I can't wait for all the beautiful moments we will create together. 🌹
        <br /><br />
        <strong>Forever yours. ❤️</strong>
      `;
    }
  </script>

</body>
</html>
